  .hero::after{
    content:"";position:absolute;inset:auto 0 0 0;height:40px;
    background:var(--cream);border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .hero .logo{height:48px;margin:0 auto 14px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35));display:table;}
  .hero .logo img{height:100%;display:block;}
  .hero .eyebrow{
    display:table;margin:0 auto 14px;align-items:center;gap:6px;
    font-family:'Kanit',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;
    color:var(--red-dark);background:var(--gold);padding:4px 12px;border-radius:20px;
  }
  .hero h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em;}
  .hero p{font-size:13px;opacity:.8;margin:0;}

  .wrap{max-width:460px;margin:-52px auto 0;padding:0 18px 44px;position:relative;z-index:2;}
  .card{background:var(--card);border-radius:22px;padding:24px 20px;box-shadow:0 18px 40px -20px rgba(19,39,67,.35);}

  .field-label{font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  input[type=text]{
    width:100%;padding:15px 16px;font-size:17px;letter-spacing:.03em;border:2px solid var(--line);
    border-radius:14px;font-family:'Space Mono',monospace;text-transform:uppercase;
  }
  input[type=text]::placeholder{font-family:'Sarabun',sans-serif;text-transform:none;letter-spacing:normal;color:#B7BECB;}
  input[type=text]:focus{outline:none;border-color:var(--red);}
  .hint{font-size:12px;color:var(--sub);margin-top:8px;}

  button.check-btn{
    width:100%;margin-top:16px;padding:15px;font-family:'Kanit',sans-serif;font-weight:600;
    font-size:15px;color:#fff;background:linear-gradient(135deg,var(--red),var(--red-dark));
    border:none;border-radius:14px;cursor:pointer;letter-spacing:.02em;
    box-shadow:0 10px 20px -8px rgba(168,13,6,.55);
  }
  button.check-btn:disabled{opacity:.6;}

  #result{margin-top:22px;display:none;}

  .idcard{border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 30px -18px rgba(80,20,15,.4);}
  .idcard-top{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:20px 20px 46px;position:relative;}
  .idcard-top .co{font-family:'Kanit',sans-serif;font-size:11px;opacity:.65;letter-spacing:.06em;}
  .idcard-top .name{font-family:'Kanit',sans-serif;font-size:19px;font-weight:700;margin-top:4px;}
  .idcard-top .code{font-family:'Space Mono',monospace;font-size:12px;opacity:.7;margin-top:2px;}
  .idcard-top .chip{position:absolute;right:20px;top:20px;width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--gold),#8B6E2F);}
  .idcard-body{background:var(--card);padding:38px 20px 20px;margin-top:-22px;border-radius:20px 20px 0 0;}
  .grid-rows{display:flex;flex-direction:column;gap:11px;}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:9px;}
  .row:last-child{border-bottom:none;padding-bottom:0;}
  .row .k{color:var(--sub);}
  .row .v{font-weight:600;text-align:right;}

  .group-banner{margin-top:16px;background:var(--gold-soft);border:1px solid #E4CD8E;color:var(--red-dark);border-radius:14px;padding:14px;text-align:center;}
  .group-banner .g{font-family:'Kanit',sans-serif;font-size:24px;font-weight:800;}
  .group-banner .lbl{font-size:12px;opacity:.75;}

  .schedule-img{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .schedule-img img{width:100%;display:block;}
  .schedule-label{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;}

  .next-steps{margin-top:18px;background:var(--gold-soft);border:1px solid #E4CD8E;border-radius:16px;padding:16px 16px 14px;}
  .next-steps .title{font-family:'Kanit',sans-serif;font-weight:700;font-size:14px;color:var(--red-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .next-steps ol{margin:0;padding-left:20px;font-size:13px;line-height:1.9;color:#5C4A22;}
  .next-steps b{color:var(--red-dark);}
  .next-steps .checklist-btn{
    display:block;text-align:center;margin-top:12px;font-family:'Kanit',sans-serif;font-weight:600;font-size:13px;
    color:#fff;background:linear-gradient(135deg,var(--red),var(--red-dark));padding:10px;border-radius:12px;text-decoration:none;
  }

  .status-card.err{background:#FDECEA;border:1px solid #F3C3C3;border-radius:20px;padding:22px 18px;}
  .not-found{text-align:center;padding:6px 4px;}
  .not-found .icon{font-size:32px;margin-bottom:8px;}
  .not-found .msg{font-family:'Kanit',sans-serif;font-weight:700;font-size:16px;margin-bottom:6px;color:var(--red-dark);}
  .not-found .sub{font-size:13px;color:#8A4A44;line-height:1.7;}
  .contact-btn{
    display:inline-block;margin-top:12px;font-family:'Kanit',sans-serif;font-size:13px;font-weight:600;
    color:#fff;background:var(--red-dark);padding:9px 18px;border-radius:20px;text-decoration:none;
  }
</style>
</head>

    <div class="hint">รหัสนี้ได้รับจากฝ่ายสรรหาเป็นการส่วนตัว</div>
    <button class="check-btn" id="checkBtn" onclick="checkStatus()">ตรวจสอบสถานะ</button>
    <div id="result"></div>
  </div>
</div>

<script>
  // TODO: แก้เป็น Web app URL จริงหลัง Deploy Apps Script
  const API_URL = "https://script.google.com/macros/s/AKfycbx9XNTTu1v77ukNtD4zbU8OWWVtigciv6lHt087zNJMtgiHKFv-mh-Rbh3gK-zH3Vts/exec";
  // TODO: แก้เป็นลิงก์เช็คลิสต์เตรียมความพร้อมจริง
  const CHECKLIST_URL = "https://unitechpcb06-lab.github.io/onboarding-checklist/";

  function scheduleImagePath(scheduleType, group){
    return `schedules/${scheduleType}-${group}.jpg`;
  }

  async function checkStatus(){
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    const result = document.getElementById('result');
    const btn = document.getElementById('checkBtn');
    result.style.display = 'block';

    if(!code){
      result.innerHTML = `<div class="status-card err"><div class="not-found">
        <div class="icon">⚠️</div><div class="msg">กรุณากรอกรหัสอ้างอิง</div>
      </div></div>`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "กำลังค้นหา...";
    result.innerHTML = `<div class="status-card"><div class="not-found">
      <div class="icon">⏳</div><div class="msg">กำลังโหลด...</div>
    </div></div>`;

    try{
      const res = await fetch(`${API_URL}?code=${encodeURIComponent(code)}`);
      const data = await res.json();

      if(!data.found){
        result.innerHTML = `<div class="status-card err"><div class="not-found">
          <div class="icon">🔎</div>
          <div class="msg">ไม่พบข้อมูล</div>
          <div class="sub">อาจยังไม่มีการบันทึกข้อมูล หรือรหัสไม่ถูกต้อง<br>กรุณาติดต่อฝ่ายบุคคล</div>
          <a class="contact-btn" href="tel:0359450738253">📞 035-945-073 ต่อ 82523</a>
        </div></div>`;
      } else {
        const scheduleLabel = data.scheduleType === 'DL' ? 'ตารางกะรายวัน (A-G)' : 'ตารางกะรายเดือน (A-D)';
        const imgPath = scheduleImagePath(data.scheduleType, data.scheduleGroup);
        result.innerHTML = `
          <div class="idcard">
            <div class="idcard-top">
              <div class="chip"></div>
              <div class="co">UNITECH PCB (THAILAND)</div>
              <div class="name">${data.name}</div>
              <div class="code">รหัสอ้างอิง ${code}</div>
            </div>
            <div class="idcard-body">
              <div class="grid-rows">
                <div class="row"><span class="k">วันเริ่มงาน</span><span class="v">${data.startDate}</span></div>
                <div class="row"><span class="k">ประเภท</span><span class="v">${data.wageType}</span></div>
                <div class="row"><span class="k">รหัสพนักงาน</span><span class="v">${data.empCode}</span></div>
                <div class="row"><span class="k">กะการทำงาน</span><span class="v">${data.shift}</span></div>
                <div class="row"><span class="k">แผนก</span><span class="v">${data.dept}</span></div>
                <div class="row"><span class="k">ตำแหน่งงาน</span><span class="v">${data.position}</span></div>
                <div class="row"><span class="k">บริษัทต้นสังกัด</span><span class="v">${data.source}</span></div>
                ${data.note ? `<div class="row"><span class="k">หมายเหตุ</span><span class="v">${data.note}</span></div>` : ''}
              </div>
              <div class="group-banner">
                <div class="lbl">คุณอยู่กลุ่ม</div>
                <div class="g">${data.scheduleGroup}</div>
              </div>
              <div class="schedule-img"><img src="${imgPath}" alt="ตารางกะ ${data.scheduleType} กลุ่ม ${data.scheduleGroup}" loading="lazy"></div>
              <div class="schedule-label">${scheduleLabel}</div>
            </div>
          </div>

          <div class="next-steps">
            <div class="title">📌 ขั้นตอนถัดไป</div>
            <ol>
              <li>ใช้ <b>รหัสพนักงาน</b> หรือ <b>วันเริ่มงาน</b> ด้านบน ยืนยันข้อมูลของท่านในระบบ</li>
              <li>ดำเนินการตามเช็คลิสต์เตรียมความพร้อมให้ครบทุกข้อ</li>
              <li>เข้ามาเซ็นสัญญาจ้าง <b>ก่อนวันเริ่มงานเท่านั้น</b></li>
            </ol>
            <a class="checklist-btn" href="${CHECKLIST_URL}" target="_blank" rel="noopener">ไปที่เช็คลิสต์เตรียมความพร้อม →</a>
          </div>
        `;
      }
    } catch(err){
      result.innerHTML = `<div class="status-card err"><div class="not-found">
        <div class="icon">⚠️</div><div class="msg">เชื่อมต่อไม่สำเร็จ</div>
        <div class="sub">ลองใหม่อีกครั้ง หรือติดต่อฝ่ายบุคคล</div>
      </div></div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "ตรวจสอบสถานะ";
    }
  }
</script>

</body>
</html>
